<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bill History — Vegetable Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="page-header">
  <div class="store-icon">🕐</div>
  <div class="header-text">
    <h1>Bill History</h1>
    <p id="recordsLabel">All records</p>
  </div>
</header>

<main class="main-content">

  <!-- Search + Filters -->
  <div class="search-bar">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <input type="text" id="searchInput" placeholder="Search by customer name..." autocomplete="off" />
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
    <div>
      <label class="form-label" style="margin-bottom:4px">From Date</label>
      <input type="date" class="form-input" id="dateFrom" style="padding:9px 12px;font-size:0.82rem" />
    </div>
    <div>
      <label class="form-label" style="margin-bottom:4px">To Date</label>
      <input type="date" class="form-input" id="dateTo" style="padding:9px 12px;font-size:0.82rem" />
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:20px">
    <button class="btn btn-primary btn-sm" id="filterBtn">🔍 Filter</button>
    <button class="btn btn-secondary btn-sm" id="resetBtn">Reset</button>
  </div>

  <!-- Summary strip -->
  <div id="summaryStrip" style="display:none;background:var(--success-bg);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
    <span id="summaryCount" style="font-size:0.8rem;color:var(--text-secondary)"></span>
    <span id="summaryTotal" style="font-size:1rem;font-weight:800;color:var(--accent)"></span>
  </div>

  <!-- Bill records -->
  <div id="billList"></div>

</main>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
    <span>Billing</span>
  </a>
  <a class="nav-item" href="customers.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Customers</span>
  </a>
  <a class="nav-item active" href="history.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>History</span>
  </a>
  <a class="nav-item" href="admin.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Admin</span>
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/history.js"></script>
</body>
</html>
