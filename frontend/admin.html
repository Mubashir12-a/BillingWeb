<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Panel — Vegetable Store</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- PIN LOGIN SCREEN -->
<div id="loginScreen" class="pin-screen">
  <div class="pin-container">
    <div class="pin-icon">🔐</div>
    <h1 class="pin-title">Admin Panel</h1>
    <p class="pin-subtitle">Enter your PIN to access</p>
    <div class="pin-dots" id="pinDots">
      <span class="pin-dot" id="dot-0"></span>
      <span class="pin-dot" id="dot-1"></span>
      <span class="pin-dot" id="dot-2"></span>
      <span class="pin-dot" id="dot-3"></span>
    </div>
    <div id="pinError" class="pin-error"></div>
    <div class="pin-keypad">
      <button class="key-btn" data-key="1">1</button>
      <button class="key-btn" data-key="2">2</button>
      <button class="key-btn" data-key="3">3</button>
      <button class="key-btn" data-key="4">4</button>
      <button class="key-btn" data-key="5">5</button>
      <button class="key-btn" data-key="6">6</button>
      <button class="key-btn" data-key="7">7</button>
      <button class="key-btn" data-key="8">8</button>
      <button class="key-btn" data-key="9">9</button>
      <button class="key-btn key-clear" data-key="clear">✕</button>
      <button class="key-btn" data-key="0">0</button>
      <button class="key-btn key-del" data-key="del">⌫</button>
    </div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard" style="display:none">

  <header class="page-header">
    <div class="store-icon">🛡️</div>
    <div class="header-text">
      <h1>Admin Panel</h1>
      <p>Vegetable Store Management</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="lockBtn" title="Lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </div>
  </header>

  <main class="main-content">

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="statCustomers">—</div>
        <div class="stat-label">Customers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statToday">—</div>
        <div class="stat-label">Today's Bills</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statMonth">—</div>
        <div class="stat-label">Month Total</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="pill-tabs">
      <button class="pill-tab active" data-tab="add">➕ Add Customer</button>
      <button class="pill-tab" data-tab="manage">👥 Manage</button>
    </div>

    <!-- ADD CUSTOMER TAB -->
    <div id="tab-add">
      <div class="card" style="margin-bottom:16px">
        <div style="font-size:0.9rem;font-weight:700;margin-bottom:16px;color:var(--text-secondary)">New Customer</div>
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" id="newName" type="text" placeholder="e.g. MOHD RIYAZ" />
        </div>
        <div class="form-group">
          <label class="form-label">WhatsApp Phone (with country code) *</label>
          <input class="form-input" id="newPhone" type="tel" placeholder="e.g. 919876543210" />
        </div>
        <div class="form-group">
          <label class="form-label">Notes (optional)</label>
          <input class="form-input" id="newNotes" type="text" placeholder="e.g. Near Masjid" />
        </div>
        <button class="btn btn-primary btn-full" id="addCustomerBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Add Customer
        </button>
      </div>
    </div>

    <!-- MANAGE CUSTOMERS TAB -->
    <div id="tab-manage" style="display:none">
      <div class="search-bar">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="text" id="manageSearch" placeholder="Search customers..." autocomplete="off" />
      </div>
      <div id="manageList"></div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      <span>Billing</span>
    </a>
    <a class="nav-item" href="customers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Customers</span>
    </a>
    <a class="nav-item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
    </a>
    <a class="nav-item active" href="admin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Admin</span>
    </a>
  </nav>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Customer</span>
      <button class="modal-close" id="closeEditModal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <input type="hidden" id="editId" />
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" id="editName" type="text" />
    </div>
    <div class="form-group">
      <label class="form-label">WhatsApp Phone</label>
      <input class="form-input" id="editPhone" type="tel" />
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <input class="form-input" id="editNotes" type="text" />
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary" id="saveEditBtn" style="flex:1">Save Changes</button>
      <button class="btn btn-danger btn-sm" id="deleteCustomerBtn">Delete</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
